<!doctype html>
<html lang="uz"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>One Year · Lug'at</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root{--bg:var(--tg-theme-bg-color,#fff);--tx:var(--tg-theme-text-color,#14141f);--hint:var(--tg-theme-hint-color,#6b7280);--sec:var(--tg-theme-secondary-bg-color,#f0f1f7);--ac:#3b4cca;--ok:#15803d;--no:#b91c1c}
*{box-sizing:border-box;margin:0}
body{background:var(--bg);color:var(--tx);font:16px/1.55 system-ui,-apple-system,"Segoe UI",sans-serif;padding:max(12px,env(safe-area-inset-top)) 14px max(24px,env(safe-area-inset-bottom));max-width:560px;margin:auto}
button{font:inherit;color:inherit;border:0;background:var(--sec);border-radius:12px;padding:10px 14px;min-height:48px;cursor:pointer;transition:transform .2s}
button:active{transform:scale(.97)}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
button[disabled]{opacity:.4}
.btn{background:var(--ac);color:#fff;font-weight:600;flex:1}
.row{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
.row>button{flex:1}
.top{display:flex;justify-content:space-between;align-items:center;margin:6px 0 14px;gap:8px}
small{color:var(--hint);display:block;font-size:13px;line-height:1.4}
.pills span{display:inline-block;background:var(--sec);border-radius:20px;padding:5px 11px;margin-left:6px;font-size:14px}
.card{background:var(--sec);border-radius:14px;padding:14px;margin-bottom:10px}
.lv{display:grid;grid-template-columns:1fr auto;gap:8px 10px;align-items:center;cursor:pointer}
.lv.lock{opacity:.55}
.bar{grid-column:1/3;height:6px;background:var(--bg);border-radius:4px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--ac)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.bl{text-align:left;padding:14px}
.bl.done{box-shadow:inset 0 0 0 2px var(--ok)}
.bl.lock{opacity:.5}
.w{font-size:32px;font-weight:700;letter-spacing:-.5px;line-height:1.2}
.chip{display:inline-block;background:var(--bg);border-radius:10px;padding:2px 9px;margin:0 6px 6px 0;font-size:14px}
.er{font-size:14px;min-height:21px;color:var(--no)}
textarea,input{width:100%;font:inherit;color:var(--tx);background:var(--bg);border:1px solid var(--hint);border-radius:12px;padding:10px}
.opt{display:block;width:100%;text-align:left;margin-top:8px}
.opt.ok,.ok{background:var(--ok);color:#fff}
.opt.no,.no{background:var(--no);color:#fff}
#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#222;color:#fff;border-radius:20px;padding:10px 16px;font-size:14px;opacity:0;pointer-events:none;transition:opacity .2s}
#toast.on{opacity:1}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style></head><body><div id="app"></div><div id="toast" role="status"></div>
<script>
const LV=[['a1',200],['a2',300],['b1',500],['b2',640],['c1',240],['c2',120]],OPEN=['a1','a2','b1'];
const IRR={go:['went','gone'],come:['came'],eat:['ate','eaten'],drink:['drank','drunk'],sleep:['slept'],write:['wrote','written'],speak:['spoke','spoken'],buy:['bought'],man:['men'],woman:['women'],child:['children'],have:['has','had'],make:['made'],give:['gave','given'],take:['took','taken'],see:['saw','seen'],find:['found'],know:['knew','known'],think:['thought'],tell:['told'],say:['said'],run:['ran'],sit:['sat'],stand:['stood'],meet:['met'],sing:['sang','sung'],swim:['swam','swum'],read:['read']};
const tg=window.Telegram&&Telegram.WebApp;
try{tg.ready();tg.expand()}catch(e){}
const app=document.getElementById('app');
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const sh=a=>a.map(x=>[Math.random(),x]).sort((p,q)=>p[0]-q[0]).map(x=>x[1]);
let S={xp:0,streak:0,last:'',done:{},pref:'us'},V={},cache={},started=false;
try{Object.assign(S,JSON.parse(localStorage.getItem('oy')||'{}'))}catch(e){}
function save(){const j=JSON.stringify(S);try{localStorage.setItem('oy',j)}catch(e){}try{if(j.length<4000)tg.CloudStorage.setItem('oy',j)}catch(e){}}
function toast(m){const t=document.getElementById('toast');t.textContent=m;t.className='on';clearTimeout(toast.t);toast.t=setTimeout(()=>t.className='',2200)}
function haptic(t){try{tg.HapticFeedback.notificationOccurred(t)}catch(e){}}
function say(t,a,slow){try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang=a=='uk'?'en-GB':'en-US';if(slow)u.rate=.7;speechSynthesis.speak(u)}catch(e){}}
function touch(){const d=new Date().toLocaleDateString('en-CA');if(S.last===d)return;const y=new Date(Date.now()-864e5).toLocaleDateString('en-CA');S.streak=S.last===y?S.streak+1:1;S.last=d}
const cnt=l=>Object.keys(S.done).filter(k=>k.indexOf(l+'_')==0).length;
const full=l=>cnt(l)>=LV.find(x=>x[0]===l)[1]/20;
function isOpen(l){if(OPEN.includes(l))return true;const i=LV.findIndex(x=>x[0]===l);return LV.slice(0,i).every(x=>full(x[0]))}
async function load(l){if(cache[l])return cache[l];try{const r=await fetch(l+'.json',{cache:'no-cache'});if(!r.ok)throw 0;const d=await r.json();cache[l]=Array.isArray(d)?d:[]}catch(e){cache[l]=[]}return cache[l]}
const ip=(w,a)=>{const o=w.ipa;const v=typeof o==='string'?o:(o&&(o[a]||o.us))||'';return v==='?'?'':v};
function lev(a,b){const d=[...Array(a.length+1)].map((_,i)=>[i]);for(let j=1;j<=b.length;j++)d[0][j]=j;for(let i=1;i<=a.length;i++)for(let j=1;j<=b.length;j++)d[i][j]=Math.min(d[i-1][j]+1,d[i][j-1]+1,d[i-1][j-1]+(a[i-1]==b[j-1]?0:1));return d[a.length][b.length]}
function has(w,t){const x=w.toLowerCase(),toks=t.toLowerCase().match(/[a-z']+/g)||[],irr=IRR[x]||[],st=x.replace(/[ey]$/,''),re=x.length<=3?new RegExp('^'+x+'(s|es|ing|ne)?$'):null;return toks.some(k=>k===x||irr.includes(k)||(re?re.test(k):k.indexOf(st)==0))}

function home(){
 V={};
 let h=`<div class="top"><div><b style="font-size:21px">One Year</b><small>Lug'at: A1 dan C2 gacha</small></div><div class="pills"><span>Seriya ${S.streak}</span><span>XP ${S.xp}</span></div></div>
 <div class="row" style="margin:0 0 12px"><button class="${S.pref=='us'?'btn':''}" onclick="pref('us')">Amerika talaffuzi</button><button class="${S.pref=='uk'?'btn':''}" onclick="pref('uk')">Britaniya talaffuzi</button></div>`;
 LV.forEach(([l,n])=>{const o=isOpen(l),t=n/20,c=cnt(l);
  h+=`<div class="card lv ${o?'':'lock'}" role="button" tabindex="0" onclick="${o?`lvl('${l}')`:`toast('Avval oldingi darajalarni tugat')`}"><div><b>${l.toUpperCase()}</b><small>${n} so'z, ${t} blok</small></div><span>${o?c+' / '+t:'Qulf'}</span><div class="bar"><i style="width:${Math.min(100,c/t*100)}%"></i></div></div>`});
 h+=`<small>Darajalar taxminiy. Yangi daraja oldingisini tugatgach ochiladi.</small>`;
 app.innerHTML=h}
function pref(a){S.pref=a;save();home()}

async function lvl(l){
 app.innerHTML='<div class="card">Yuklanmoqda...</div>';
 const ws=await load(l);V={l,words:ws};const nb=Math.ceil(ws.length/20);
 let h=`<div class="top"><button onclick="home()">Orqaga</button><b>${l.toUpperCase()}</b></div>`;
 if(!nb)h+=`<div class="card"><b>Bu daraja tez orada qo'shiladi</b><small>${l}.json fayli index.html bilan bir papkada bo'lishi kerak.</small></div>`;
 else{h+='<div class="grid">';
  for(let i=0;i<nb;i++){const d=S.done[l+'_'+i],ok=i==0||S.done[l+'_'+(i-1)];
   h+=`<button class="bl ${d?'done':''} ${ok?'':'lock'}" onclick="${ok?`startBlock(${i})`:`toast('Avval oldingi blokni tugat')`}"><b>Blok ${i+1}</b><small>${d?'Tugagan, '+d+'%':ok?'20 ta so\'z':'Qulf'}</small></button>`}
  h+='</div>'}
 app.innerHTML=h}

function startBlock(i){V.i=i;V.ws=V.words.slice(i*20,i*20+20);V.q=V.ws.map(w=>({w}));V.ix=0;V.att=0;V.pass={};learn()}
function sayCur(a,slow){S.pref=a;save();say(V.q[V.ix].w.word,a,slow)}
function learn(){
 const w=V.q[V.ix].w,n=V.q.length,p=V.pass[V.ix];
 const ph=a=>`<button onclick="sayCur('${a}')">${a.toUpperCase()} ${esc(ip(w,a))}</button>`;
 let h=`<div class="top"><button onclick="lvl('${V.l}')">Bloklar</button><small>${V.ix+1} / ${n}</small></div><div class="card"><div class="w">${esc(w.word)}</div><small>${esc(w.pos)}${w.register?', '+esc(w.register):''}</small>
 <div class="row">${ph('us')}${ph('uk')}<button onclick="sayCur(S.pref,1)">Sekin</button></div>
 <p style="margin-top:12px;font-size:20px"><b>${esc((w.uz||[]).join(', '))}</b></p>`;
 const sy=(w.synonyms||[]).map(s=>`<span class="chip">${esc(s.w)} ${esc(s.level||'')}</span>`).join('');
 if(sy)h+=`<small style="margin-top:8px">Sinonimlar</small>${sy}`;
 if(w.usage_uz)h+=`<p style="margin-top:6px">${esc(w.usage_uz)}</p>`;
 if(w.example)h+=`<p style="margin-top:8px"><i>${esc(w.example)}</i></p><small>${esc(w.example_uz||'')}</small>`;
 if(w.ielts_tip)h+=`<small style="margin-top:8px">IELTS: ${esc(w.ielts_tip)}</small>`;
 h+='</div>';
 if(p)h+=`<div class="card"><b style="color:var(--ok)">Gap qabul qilindi</b></div>`;
 else h+=`<div class="card"><label for="sn"><b>Shu so'z bilan o'z gapingni yoz</b></label><small>Kamida 4 ta so'z. So'zning shakli ham bo'ladi.</small><textarea id="sn" rows="2" style="margin-top:8px" oninput="document.getElementById('er').textContent=''"></textarea><div id="er" class="er"></div><div class="row"><button class="btn" onclick="chk()">Tekshirish</button>${V.att>=3?'<button onclick="pass(true)">O\'tkazib yuborish</button>':''}</div></div>`;
 h+=`<div class="row"><button onclick="prev()" ${V.ix?'':'disabled'}>Orqaga</button><button onclick="hard()">Qiyin</button><button class="btn" onclick="nx()" ${p?'':'disabled'}>Keyingi</button></div>`;
 app.innerHTML=h}
function chk(){
 const w=V.q[V.ix].w,t=document.getElementById('sn').value.trim(),er=document.getElementById('er');
 if(!t){er.textContent='Avval gap yoz.';return}
 if((t.match(/[A-Za-z']+/g)||[]).length<4){er.textContent='Kamida 4 ta so\'z yoz.';return}
 if(!has(w.word,t)){V.att++;er.textContent=`Gapda "${w.word}" so'zi bo'lishi kerak. Urinish ${V.att} / 3`;if(V.att>=3)learn();return}
 pass(false)}
function pass(skip){V.pass[V.ix]=1;V.att=0;if(!skip)haptic('success');learn()}
function prev(){if(V.ix>0){V.ix--;learn()}}
function hard(){const it=V.q[V.ix];if(it.r)return toast('Bu so\'z oxirida allaqachon qaytadi');it.r=1;V.q.push({w:it.w,r:1});V.pass[V.q.length-1]=1;toast('Oxirida yana ko\'rsatiladi')}
function nx(){if(V.ix<V.q.length-1){V.ix++;V.att=0;learn()}else startTest()}

function mk(w,t){
 const o=f=>{const a=f(w);return sh([a,...sh(V.words.filter(x=>x!==w&&f(x)&&f(x)!==a)).slice(0,3).map(f)])};
 if(t==1)return{k:1,t:'mc',p:w.uz[0],o:o(x=>x.word),a:w.word,w};
 if(t==2&&w.example){const re=new RegExp('\\b'+w.word+'\\w*','i');if(re.test(w.example))return{k:2,t:'mc',p:w.example.replace(re,'_____'),o:o(x=>x.word),a:w.word,w}}
 if(t==3)return{k:3,t:'dc',a:w.word,w};
 return{k:0,t:'mc',p:w.word,o:o(x=>(x.uz||[])[0]),a:w.uz[0],w}}
function startTest(){V.qs=sh(V.ws).map((w,i)=>mk(w,i%4));V.qi=0;V.c=0;V.wr=[];tq()}
const LAB=['Tarjimasini tanla','Inglizchasini tanla','Bo\'sh joyni to\'ldir'];
function tq(){
 const q=V.qs[V.qi];
 let h=`<div class="top"><button onclick="lvl('${V.l}')">Chiqish</button><small>Test ${V.qi+1} / ${V.qs.length}</small></div><div class="card">`;
 if(q.t=='mc')h+=`<small>${LAB[q.k]}</small><p style="font-size:20px;margin:6px 0"><b>${esc(q.p)}</b></p>`+q.o.map((x,i)=>`<button class="opt" onclick="pick(${i})">${esc(x)}</button>`).join('');
 else{h+=`<small>Eshitib, so'zni yoz</small><div class="row"><button onclick="say(V.qs[V.qi].a,S.pref)">Eshitish</button><button onclick="say(V.qs[V.qi].a,S.pref,1)">Sekin</button></div><input id="dt" autocomplete="off" autocapitalize="off" style="margin-top:10px" aria-label="So'z"><div id="er" class="er"></div><button class="btn" style="width:100%" onclick="dchk()">Tekshirish</button>`}
 h+='</div>';app.innerHTML=h;if(q.t=='dc')say(q.a,S.pref)}
function ans(ok){if(ok)V.c++;else V.wr.push(V.qs[V.qi].w);haptic(ok?'success':'error')}
function nxtBtn(){app.querySelector('.card').insertAdjacentHTML('beforeend','<button class="btn" style="width:100%;margin-top:10px" onclick="nq()">Keyingi</button>')}
function pick(i){const q=V.qs[V.qi];if(q.d)return;q.d=1;const ok=q.o[i]===q.a;ans(ok);
 app.querySelectorAll('.opt').forEach((b,j)=>{if(q.o[j]===q.a)b.classList.add('ok');else if(j==i)b.classList.add('no')});nxtBtn()}
function dchk(){const q=V.qs[V.qi];if(q.d)return;const v=document.getElementById('dt').value.trim().toLowerCase(),er=document.getElementById('er');
 if(!v){er.textContent='Avval so\'zni yoz.';return}
 q.d=1;const d=lev(v,q.a.toLowerCase()),ok=d<=1;ans(ok);
 er.style.color=ok?'var(--ok)':'var(--no)';er.textContent=d==0?'To\'g\'ri':ok?`Deyarli to'g'ri: ${q.a}`:`Noto'g'ri. To'g'ri javob: ${q.a}`;nxtBtn()}
function nq(){V.qi++;V.qi<V.qs.length?tq():fin()}
function fin(){
 const n=V.qs.length,p=Math.round(V.c/n*100),k=V.l+'_'+V.i,win=p>=80,nb=Math.ceil(V.words.length/20);
 touch();
 if(win){const first=!S.done[k];S.done[k]=Math.max(S.done[k]||0,p);if(first)S.xp+=50}
 save();
 let h=`<div class="card" style="text-align:center"><div class="w">${p}%</div><p>${V.c} / ${n} to'g'ri</p><p><b>${win?'Blok tugadi':'Kamida 80% kerak. Yana urinib ko\'r.'}</b></p>${win?'<small>Birinchi marta tugatganda +50 XP</small>':''}</div>`;
 if(V.wr.length)h+=`<div class="card"><small>Xato qilingan so'zlar</small>${V.wr.map(w=>`<p><b>${esc(w.word)}</b>: ${esc((w.uz||[]).join(', '))}</p>`).join('')}</div>`;
 h+='<div class="row">';
 if(win&&V.i+1<nb)h+=`<button class="btn" onclick="startBlock(${V.i+1})">Keyingi blok</button>`;
 if(!win)h+=`<button class="btn" onclick="startTest()">Testni qayta yech</button><button onclick="startBlock(${V.i})">So'zlarni qayta ko'r</button>`;
 h+=`<button onclick="lvl('${V.l}')">Bloklar</button></div>`;
 app.innerHTML=h;haptic(win?'success':'warning')}

function go(){if(started)return;started=true;home()}
(function(){
 if(!localStorage.getItem('oy')&&tg&&tg.CloudStorage){
  try{tg.CloudStorage.getItem('oy',(e,v)=>{if(!e&&v){try{Object.assign(S,JSON.parse(v))}catch(x){}}go()});setTimeout(go,1500);return}catch(e){}
 }
 go()})();
</script></body></html>
